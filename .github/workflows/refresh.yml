name: Refresh FDI VSL (3h)

on:
  schedule:
    - cron: '9 */3 * * *'   # reserva: o disparo principal e o cron-job.org (30 em 30 min)
  workflow_dispatch:          # gatilho confiavel = cron-job.org faz POST aqui

permissions:
  contents: write

concurrency:
  group: fdi-vsl-pages
  cancel-in-progress: true   # auto-destrava: se um run ficar preso em queued, o proximo dispatch cancela e segue (build idempotente, ~3min << intervalo)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build data.js (queries Meta FDI x vendas VSL + ROAS/funil de video)
        shell: pwsh
        run: pwsh -File ./build.ps1 -Mode all
      - name: Commit data.js se mudou (a prova de corrida)
        shell: pwsh
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if (-not (git status --porcelain data.js)) { Write-Host "sem mudancas"; exit 0 }
          $ok = $false
          for ($i=0; $i -lt 5; $i++) {
            git fetch origin main
            git reset --soft origin/main
            git add data.js
            if (-not (git status --porcelain data.js)) { Write-Host "data.js igual ao origin, nada a publicar"; $ok=$true; break }
            git commit -m ("auto: cloud " + (Get-Date -Format 'yyyy-MM-dd HH:mm'))
            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) { $ok=$true; break }
            Write-Host ("push rejeitado, retry " + ($i+1) + "...")
            Start-Sleep -Seconds 3
          }
          if (-not $ok) { throw "push falhou apos 5 tentativas" }
